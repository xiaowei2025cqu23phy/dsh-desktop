<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>屏保 — DeepSeek Harness</title>
  <link rel="stylesheet" href="./screensaver.css" />
</head>
<body>
  <img id="ss-wallpaper" alt="" aria-hidden="true" hidden />
  <div id="root">
    <header id="ss-top">
      <div class="ss-top-left">
        <span class="ss-logo">◈</span>
        <span class="ss-title">DeepSeek Harness</span>
      </div>
      <div class="ss-top-right">
        <span id="ss-clock" class="ss-clock">--:--:--</span>
      </div>
    </header>

    <main id="ss-stream" class="ss-stream">
      <div id="ss-ambient" class="ss-ambient">
        <div class="ss-ambient-logo">◈</div>
        <h1>DeepSeek Harness</h1>
        <div id="ss-ambient-clock" class="ss-ambient-clock">--:--</div>
        <p id="ss-ambient-date" class="ss-ambient-sub"></p>
      </div>
    </main>

    <footer id="ss-bottom">
      <span class="ss-hint">移动鼠标或按任意键退出</span>
    </footer>
  </div>
  <script src="./screensaver.js"></script>
</body>
</html>
