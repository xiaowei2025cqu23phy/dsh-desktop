<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Whale Body Gradient: Deep Indigo to Vivid Blue & Cyan -->
    <linearGradient id="whaleBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="35%" stop-color="#1D4ED8" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Belly Gradient -->
    <linearGradient id="whaleBellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Water Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Soft Shadow Filter for Fin -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Main Whale Group -->
  <g id="whale">
    <!-- Body & Tail Flukes (Continuous smooth path) -->
    <path d="M 32 108 
             C 22 96, 14 82, 22 76 
             C 28 72, 36 86, 42 98 
             C 65 68, 110 54, 150 76 
             C 168 86, 174 102, 164 118 
             C 148 142, 98 146, 58 126 
             C 42 120, 32 128, 24 136 
             C 18 142, 12 134, 22 120 
             C 28 112, 32 109, 32 108 Z" 
          fill="url(#whaleBodyGrad)" />

    <!-- White Belly -->
    <path d="M 58 126 
             C 90 144, 138 138, 156 121 
             C 163 114, 160 106, 148 107 
             C 122 108, 85 118, 58 126 Z" 
          fill="url(#whaleBellyGrad)" />

    <!-- Circuit / AI Pattern on Back -->
    <g id="ai-circuit" stroke="#E0F2FE" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Circuit Traces -->
      <path d="M 106 71 L 114 63 H 122" stroke-width="1.5" />
      <path d="M 94 71 L 86 63 H 78" stroke-width="1.5" />
      <path d="M 94 79 L 88 85 H 82" stroke-width="1.5" />
      <path d="M 100 80 V 88" stroke-width="1.5" />

      <!-- Circuit Nodes -->
      <circle cx="122" cy="63" r="2" fill="#E0F2FE" fill-opacity="0.85" stroke="none" />
      <circle cx="78" cy="63" r="2" fill="#E0F2FE" fill-opacity="0.85" stroke="none" />
      <circle cx="82" cy="85" r="2" fill="#E0F2FE" fill-opacity="0.85" stroke="none" />
      <circle cx="100" cy="88" r="2" fill="#E0F2FE" fill-opacity="0.85" stroke="none" />

      <!-- AI Chip Core -->
      <rect x="94" y="68" width="12" height="12" rx="3" fill="#1D4ED8" fill-opacity="0.4" stroke="#E0F2FE" stroke-opacity="0.85" stroke-width="1.2" />
      <rect x="97" y="71" width="6" height="6" rx="1.5" fill="#E0F2FE" fill-opacity="0.9" stroke="none" />
    </g>

    <!-- Pectoral Fin -->
    <path d="M 96 116 
             C 88 128, 94 144, 108 142 
             C 117 140, 120 128, 108 116 
             C 102 112, 98 112, 96 116 Z" 
          fill="url(#whaleBodyGrad)" 
          stroke="#60A5FA" 
          stroke-opacity="0.4" 
          stroke-width="1"
          filter="url(#softShadow)" />

    <!-- Big Friendly Eye -->
    <g id="eye">
      <circle cx="140" cy="93" r="7.5" fill="#0F172A" />
      <circle cx="142.5" cy="90.5" r="2.8" fill="#FFFFFF" />
      <circle cx="137.5" cy="95.5" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- Blush Cheek -->
    <ellipse cx="148" cy="101" rx="4.5" ry="2.5" fill="#F43F5E" opacity="0.22" />

    <!-- Small Cute Smile -->
    <path d="M 152 98 Q 157 103, 161 97" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />

    <!-- Water Bubbles Near Mouth -->
    <g id="bubbles">
      <!-- Bubble 1 -->
      <circle cx="173" cy="86" r="4.5" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="0.8" />
      <circle cx="171.8" cy="84.2" r="1.2" fill="#FFFFFF" opacity="0.8" />

      <!-- Bubble 2 -->
      <circle cx="182" cy="75" r="3" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="0.7" />
      <circle cx="181.2" cy="73.8" r="0.8" fill="#FFFFFF" opacity="0.8" />

      <!-- Bubble 3 -->
      <circle cx="176" cy="65" r="2" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.5" />
    </g>
  </g>
</svg>