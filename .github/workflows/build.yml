name: build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check main / renderer / remote
        run: npx tsc -p tsconfig.json --noEmit && npx tsc -p tsconfig.renderer.json --noEmit && npx tsc -p tsconfig.remote.json --noEmit

      - name: Type-check scripts (checkJs)
        shell: pwsh
        run: |
          $out = npx tsc -p tsconfig.scripts.json 2>&1
          $errors = $out | Select-String -Pattern '^scripts/'
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "scripts checkJs 通过(仅脚本自身的错误会导致失败;dist/ 为编译产物,忽略其类型噪声)"

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm test

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: package-${{ github.ref }}
      cancel-in-progress: true
    # 打包只在打 tag 或手动触发时跑;测试已在每次 push/PR 上跑过。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (installer + zip)
        run: npx electron-builder --win nsis zip

      - name: Create release if missing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/*.exe release/*.zip --clobber

      - name: Upload artifacts (untagged builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.zip
